services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Browser talks to the backend directly on localhost, not via the
      # Docker network, so this stays localhost even inside Compose.
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
